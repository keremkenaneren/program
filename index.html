<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS 2026 | Profesyonel Çalışma Takibi</title>
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #161b2c;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2d364d;
            --primary: #6366f1;
            /* Indigo - modern profesyonel renk */
            --primary-hover: #818cf8;
            --danger: #ef4444;
            --warning: #fbbf24;
            --success: #22c55e;
            --accent: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        /* Navbar */
        nav {
            background-color: rgba(22, 27, 44, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .countdown {
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title span {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-card:hover {
            border-color: var(--primary);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .day-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* Task List */
        .task-list {
            list-style: none;
            flex-grow: 1;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
            border-radius: 4px;
        }

        .task-text {
            font-size: 1.05rem;
            /* Büyütüldü */
            font-weight: 500;
            color: #cbd5e1;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px;
            margin-top: 15px;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background-color: rgba(251, 191, 36, 0.1);
            color: var(--warning);
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .btn-edit:hover {
            background-color: var(--warning);
            color: #000;
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: white;
            padding: 16px 32px;
            font-size: 1rem;
            border-radius: 10px;
            margin: 40px auto;
            display: flex;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 15px;
            }

            .nav-brand {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-brand">YKS 2026 FOCUS</div>
        <div class="countdown" id="countdown-display">Yükleniyor...</div>
    </nav>

    <div class="container">
        <h2 class="section-title">Haftalık Rutin</h2>
        <div class="schedule-grid" id="schedule-container"></div>

        <h2 class="section-title" style="margin-top: 60px;">AYT Matematik Fokus <span>4 Haftalık Kamp</span></h2>
        <div class="day-card" style="width: 100%;">
            <ul class="task-list" id="ayt-mat-list"></ul>
            <button class="btn-add" onclick="addTask('aytMat')">+ Stratejik Konu Ekle</button>
        </div>

        <button class="btn-refresh" onclick="resetAllChecks()">
            🔄 Hafta Analizini Bitir ve Sıfırla
        </button>
    </div>

    <script>
        const yksDate = new Date(2026, 5, 20);

        function updateCountdown() {
            const now = new Date();
            const diff = yksDate - now;
            if (diff <= 0) {
                document.getElementById('countdown-display').innerText = "Sınav Günü!";
                return;
            }
            const daysTotal = Math.floor(diff / (1000 * 60 * 60 * 24));
            const months = Math.floor(daysTotal / 30);
            const days = daysTotal % 30;
            document.getElementById('countdown-display').innerText = `${months} Ay ${days} Gün Kaldı`;
        }
        setInterval(updateCountdown, 3600000);
        updateCountdown();

        // --- ASIL AYT MAT PLANINIZ BURADA ---
        const defaultSchedule = {
            'Pazartesi': [
                { id: 11, text: "1. BLOK: TEKRAR", completed: false },
                { id: 12, text: "2. BLOK: AYT Fizik", completed: false },
                { id: 13, text: "3. BLOK: AYT Kimya", completed: false },
                { id: 14, text: "4. BLOK: Soru Çözümü", completed: false },
                { id: 15, text: "5. BLOK: Türkçe Deneme", completed: false },
                { id: 16, text: "6. BLOK: Problem/Sayılar/Geometri Deneme", completed: false },
                { id: 17, text: "7. BLOK: TYT Fen Branş Denemeleri x2", completed: false },
                { id: 18, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Salı': [
                { id: 21, text: "1. BLOK: TEKRAR", completed: false },
                { id: 22, text: "2. BLOK: AYT Fizik", completed: false },
                { id: 23, text: "3. BLOK: AYT Kimya", completed: false },
                { id: 24, text: "4. BLOK: Soru Çözümü", completed: false },
                { id: 25, text: "5-7. BLOK: TYT GENEL DENEME", completed: false },
                { id: 26, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Çarşamba': [
                { id: 31, text: "1. BLOK: TEKRAR", completed: false },
                { id: 32, text: "2. BLOK: AYT Fizik", completed: false },
                { id: 33, text: "3. BLOK: AYT Kimya", completed: false },
                { id: 34, text: "4. BLOK: Soru Çözümü", completed: false },
                { id: 35, text: "5. BLOK: Türkçe Deneme", completed: false },
                { id: 36, text: "6. BLOK: Problem/Sayılar/Geometri Deneme", completed: false },
                { id: 37, text: "7. BLOK: TYT Fen Branş Denemeleri x2", completed: false },
                { id: 38, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Perşembe': [
                { id: 41, text: "1. BLOK: TEKRAR", completed: false },
                { id: 42, text: "2. BLOK: AYT Fizik", completed: false },
                { id: 43, text: "3. BLOK: AYT Kimya", completed: false },
                { id: 44, text: "4. BLOK: Soru Çözümü", completed: false },
                { id: 45, text: "5. BLOK: Türkçe Deneme", completed: false },
                { id: 46, text: "6. BLOK: Problem/Geometri Deneme", completed: false },
                { id: 47, text: "7. BLOK: TYT Fen Branş Denemeleri x2", completed: false },
                { id: 48, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Cuma': [
                { id: 51, text: "1. BLOK: TEKRAR", completed: false },
                { id: 52, text: "2-4. BLOK: TYT GENEL DENEME", completed: false },
                { id: 53, text: "5. BLOK: TEKRAR", completed: false },
                { id: 54, text: "6. BLOK: Dilbilgisi", completed: false },
                { id: 55, text: "7. BLOK: Sosyal", completed: false },
                { id: 56, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Cumartesi': [
                { id: 61, text: "1. BLOK: TEKRAR", completed: false },
                { id: 62, text: "2. BLOK: Problemler", completed: false },
                { id: 63, text: "3. BLOK: Geometri", completed: false },
                { id: 64, text: "4. BLOK: AYT Fizik", completed: false },
                { id: 65, text: "5. BLOK: AYT Kimya", completed: false },
                { id: 66, text: "6. BLOK: TYT Fen Tekrar", completed: false },
                { id: 67, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'Pazar': [
                { id: 71, text: "1. BLOK: TEKRAR", completed: false },
                { id: 72, text: "2. BLOK: Problemler", completed: false },
                { id: 73, text: "3. BLOK: Geometri", completed: false },
                { id: 74, text: "4. BLOK: Türkçe Deneme", completed: false },
                { id: 75, text: "5. BLOK: Hafta Analizi", completed: false },
                { id: 76, text: "8. BLOK: TEKRAR", completed: false }
            ],
            'aytMat': [
                { id: 101, text: "📅 1. HAFTA: Fonksiyonlar", completed: false },
                { id: 102, text: "📅 1. HAFTA: Polinom", completed: false },
                { id: 103, text: "📅 1. HAFTA: 2. Derece Denklemler", completed: false },
                { id: 104, text: "📅 2. HAFTA: Parabol", completed: false },
                { id: 105, text: "📅 2. HAFTA: Eşitsizlik", completed: false },
                { id: 106, text: "📅 2. HAFTA: Mutlak Değer", completed: false },
                { id: 107, text: "📅 3. HAFTA: Trigonometri", completed: false },
                { id: 108, text: "📅 3. HAFTA: Logaritma", completed: false },
                { id: 109, text: "📅 4. HAFTA: Limit", completed: false },
                { id: 110, text: "📅 4. HAFTA: Türev", completed: false },
                { id: 111, text: "📅 4. HAFTA: İntegral Başlangıç", completed: false }
            ]
        };

        let state = JSON.parse(localStorage.getItem('yksPlanState_v2')) || defaultSchedule;

        function saveState() {
            localStorage.setItem('yksPlanState_v2', JSON.stringify(state));
        }

        function render() {
            const container = document.getElementById('schedule-container');
            const aytList = document.getElementById('ayt-mat-list');
            container.innerHTML = '';
            aytList.innerHTML = '';

            ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'].forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                let tasks = state[day].map(t => createTaskHTML(day, t)).join('');
                card.innerHTML = `<div class="day-title">${day}</div><ul class="task-list">${tasks}</ul><button class="btn-add" onclick="addTask('${day}')">+ Ekle</button>`;
                container.appendChild(card);
            });

            state['aytMat'].forEach(t => aytList.innerHTML += createTaskHTML('aytMat', t));
        }

        function createTaskHTML(cat, task) {
            return `
                <li class="task-item">
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${cat}', ${task.id})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn-edit" onclick="editTask('${cat}', ${task.id})">✎</button>
                        <button class="btn-delete" onclick="deleteTask('${cat}', ${task.id})">✕</button>
                    </div>
                </li>`;
        }

        function toggleTask(cat, id) {
            const t = state[cat].find(x => x.id === id);
            if (t) { t.completed = !t.completed; saveState(); render(); }
        }

        function addTask(cat) {
            const text = prompt("Görev?");
            if (text) { state[cat].push({ id: Date.now(), text, completed: false }); saveState(); render(); }
        }

        function editTask(cat, id) {
            const t = state[cat].find(x => x.id === id);
            const newT = prompt("Düzenle:", t.text);
            if (newT) { t.text = newT; saveState(); render(); }
        }

        function deleteTask(cat, id) {
            if (confirm("Silinsin mi?")) { state[cat] = state[cat].filter(x => x.id !== id); saveState(); render(); }
        }

        function resetAllChecks() {
            if (confirm("Tüm tikler temizlenecek, emin misin?")) {
                for (let c in state) state[c].forEach(t => t.completed = false);
                saveState(); render();
            }
        }

        render();
    </script>
</body>

</html>
