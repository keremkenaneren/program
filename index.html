<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS 2026 | Profesyonel Çalışma Takibi</title>
    <style>
        :root {
            /* Sade ve mat karanlık tema renkleri */
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
            --primary: #4a90e2;
            /* Düz, göz yormayan bir mavi */
            --primary-hover: #357abd;
            --danger: #cf6679;
            --warning: #f2c94c;
            --success: #6fcf97;
            --accent: #bb86fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        /* Navbar */
        nav {
            background-color: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
        }

        .countdown {
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(74, 144, 226, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid rgba(74, 144, 226, 0.2);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title span {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease-in-out;
        }

        .day-card:hover {
            border-color: var(--primary);
        }

        .day-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* Task List */
        .task-list {
            list-style: none;
            flex-grow: 1;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
            border-radius: 4px;
        }

        .task-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: #cccccc;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px;
            margin-top: 15px;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background-color: rgba(242, 201, 76, 0.1);
            color: var(--warning);
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .btn-edit:hover {
            background-color: var(--warning);
            color: #000;
        }

        .btn-delete {
            background-color: rgba(207, 102, 121, 0.1);
            color: var(--danger);
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-refresh {
            background: var(--primary);
            color: white;
            padding: 16px 32px;
            font-size: 1rem;
            border-radius: 10px;
            margin: 40px auto;
            display: flex;
        }

        .btn-refresh:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Saat Girişi CSS */
        .hours-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hours-container label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .hours-input {
            width: 80px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .hours-input:focus {
            border-color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 15px;
            }

            .nav-brand {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-brand">YKS 2026 FOCUS</div>
        <div class="countdown" id="countdown-display">Yükleniyor...</div>
    </nav>

    <div class="container">
        <h2 class="section-title">Haftalık Rutin</h2>
        <div class="schedule-grid" id="schedule-container"></div>

        <h2 class="section-title" style="margin-top: 60px;">AYT Matematik Fokus <span>4 Haftalık Kamp</span></h2>
        <div class="day-card" style="width: 100%;">
            <ul class="task-list" id="ayt-mat-list"></ul>
            <button class="btn-add" onclick="addTask('aytMat')">+ Stratejik Konu Ekle</button>
        </div>

        <button class="btn-refresh" onclick="resetAllChecks()">
            🔄 Hafta Analizini Bitir ve Sıfırla
        </button>
    </div>

    <script>
        const yksDate = new Date(2026, 5, 20);

        function updateCountdown() {
            const now = new Date();
            const diff = yksDate - now;
            if (diff <= 0) {
                document.getElementById('countdown-display').innerText = "Sınav Günü!";
                return;
            }
            const daysTotal = Math.floor(diff / (1000 * 60 * 60 * 24));
            const months = Math.floor(daysTotal / 30);
            const days = daysTotal % 30;
            document.getElementById('countdown-display').innerText = `${months} Ay ${days} Gün Kaldı`;
        }
        setInterval(updateCountdown, 3600000);
        updateCountdown();

        // --- GÖRSELE GÖRE GÜNCELLENMİŞ PLAN ---
        const defaultSchedule = {
            'Pazartesi': [
                { id: 11, text: "Dil Bilgisi deneme", completed: false },
                { id: 12, text: "TYT Fen tekrar", completed: false },
                { id: 13, text: "Organik kimya", completed: false },
                { id: 14, text: "AYT Fizik soru çözüm", completed: false },
                { id: 15, text: "Sistemler", completed: false },
                { id: 16, text: "Trigonometri", completed: false },
                { id: 17, text: "Geometri Deneme", completed: false }
            ],
            'Salı': [
                { id: 21, text: "Dil Bilgisi deneme", completed: false },
                { id: 22, text: "TYT Fen tekrar", completed: false },
                { id: 23, text: "Organik kimya", completed: false },
                { id: 24, text: "AYT Fizik soru çözüm", completed: false },
                { id: 25, text: "Sistemler", completed: false },
                { id: 26, text: "Trigonometri", completed: false },
                { id: 27, text: "TYT Matematik deneme", completed: false },
                { id: 28, text: "AYT Matematik konu deneme", completed: false }
            ],
            'Çarşamba': [
                { id: 31, text: "Dil Bilgisi deneme", completed: false },
                { id: 32, text: "TYT Fen tekrar", completed: false },
                { id: 33, text: "Organik kimya", completed: false },
                { id: 34, text: "AYT Fizik soru çözüm", completed: false },
                { id: 35, text: "Sistemler", completed: false },
                { id: 36, text: "Trigonometri", completed: false },
                { id: 37, text: "Geometri Deneme", completed: false },
                { id: 38, text: "AYT Matematik konu deneme", completed: false }
            ],
            'Perşembe': [
                { id: 41, text: "Dil Bilgisi deneme", completed: false },
                { id: 42, text: "TYT Fen tekrar", completed: false },
                { id: 43, text: "Organik kimya", completed: false },
                { id: 44, text: "AYT Fizik soru çözüm", completed: false },
                { id: 45, text: "Sistemler", completed: false },
                { id: 46, text: "Trigonometri", completed: false },
                { id: 47, text: "TYT Matematik deneme", completed: false },
                { id: 48, text: "AYT Matematik konu deneme", completed: false }
            ],
            'Cuma': [
                { id: 51, text: "TYT GENEL DENEME", completed: false },
                { id: 52, text: "Organik kimya", completed: false },
                { id: 53, text: "Sistemler", completed: false },
                { id: 54, text: "Trigonometri", completed: false },
                { id: 55, text: "AYT Matematik konu deneme", completed: false }
            ],
            'Cumartesi': [
                { id: 61, text: "AYT GENEL DENEME", completed: false },
                { id: 62, text: "Sosyal Deneme", completed: false },
                { id: 63, text: "Deneme Analizi", completed: false }
            ],
            'Pazar': [
                { id: 71, text: "Dil Bilgisi Deneme", completed: false },
                { id: 72, text: "Geometri Deneme", completed: false },
                { id: 73, text: "TEKRAR", completed: false },
                { id: 74, text: "Hafta Analizi", completed: false }
            ],
            'aytMat': [
                { id: 101, text: "1. HAFTA: Fonksiyonlar", completed: true },
                { id: 102, text: "1. HAFTA: Polinom", completed: true },
                { id: 103, text: "1. HAFTA: 2. Derece Denklemler", completed: true },
                { id: 104, text: "2. HAFTA: Parabol", completed: true },
                { id: 105, text: "2. HAFTA: Eşitsizlik", completed: true },
                { id: 106, text: "2. HAFTA: Mutlak Değer", completed: true },
                { id: 107, text: "3. HAFTA: Trigonometri", completed: false },
                { id: 108, text: "3. HAFTA: Logaritma", completed: false },
                { id: 109, text: "4. HAFTA: Limit", completed: false },
                { id: 110, text: "4. HAFTA: Türev", completed: false },
                { id: 111, text: "4. HAFTA: İntegral Başlangıç", completed: false },
                { id: 112, text: "EK: Benzerlik", completed: false },
                { id: 113, text: "EK: Katı Cisimler", completed: false }
            ]
        };

        // LocalStorage sürümlerini v4 yaparak yeni programın devreye girmesini sağladık.
        let state = JSON.parse(localStorage.getItem('yksPlanState_v4')) || defaultSchedule;

        let hoursState = JSON.parse(localStorage.getItem('yksHoursState_v4')) || {
            'Pazartesi': '', 'Salı': '', 'Çarşamba': '', 'Perşembe': '', 'Cuma': '', 'Cumartesi': '', 'Pazar': ''
        };

        function saveState() {
            localStorage.setItem('yksPlanState_v4', JSON.stringify(state));
        }

        function saveHours() {
            localStorage.setItem('yksHoursState_v4', JSON.stringify(hoursState));
        }

        function updateHours(day, value) {
            hoursState[day] = value;
            saveHours();
        }

        function render() {
            const container = document.getElementById('schedule-container');
            const aytList = document.getElementById('ayt-mat-list');
            container.innerHTML = '';
            aytList.innerHTML = '';

            ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'].forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                let tasks = state[day].map(t => createTaskHTML(day, t)).join('');

                let currentHours = hoursState[day] || '';
                let hoursHTML = `
                    <div class="hours-container">
                        <label>Çalışma (Saat):</label>
                        <input type="number" step="0.5" min="0" class="hours-input" value="${currentHours}" onchange="updateHours('${day}', this.value)" placeholder="0">
                    </div>
                `;

                card.innerHTML = `<div class="day-title">${day}</div><ul class="task-list">${tasks}</ul><button class="btn-add" onclick="addTask('${day}')">+ Görev Ekle</button>${hoursHTML}`;
                container.appendChild(card);
            });

            state['aytMat'].forEach(t => aytList.innerHTML += createTaskHTML('aytMat', t));
        }

        function createTaskHTML(cat, task) {
            return `
                <li class="task-item">
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${cat}', ${task.id})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn-edit" onclick="editTask('${cat}', ${task.id})">✎</button>
                        <button class="btn-delete" onclick="deleteTask('${cat}', ${task.id})">✕</button>
                    </div>
                </li>`;
        }

        function toggleTask(cat, id) {
            const t = state[cat].find(x => x.id === id);
            if (t) { t.completed = !t.completed; saveState(); render(); }
        }

        function addTask(cat) {
            const text = prompt("Görev?");
            if (text) { state[cat].push({ id: Date.now(), text, completed: false }); saveState(); render(); }
        }

        function editTask(cat, id) {
            const t = state[cat].find(x => x.id === id);
            const newT = prompt("Düzenle:", t.text);
            if (newT) { t.text = newT; saveState(); render(); }
        }

        function deleteTask(cat, id) {
            if (confirm("Silinsin mi?")) { state[cat] = state[cat].filter(x => x.id !== id); saveState(); render(); }
        }

        function resetAllChecks() {
            if (confirm("Tüm tikler ve çalışma saatleri temizlenecek, emin misin?")) {
                for (let c in state) state[c].forEach(t => t.completed = false);
                for (let d in hoursState) hoursState[d] = '';

                saveState();
                saveHours();
                render();
            }
        }

        render();
    </script>
</body>

</html>
